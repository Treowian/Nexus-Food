<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Food</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff4757">
    <link rel="icon" type="image/png" href="assets/icon.png">
    
    <link rel="stylesheet" href="./css/variables.css">
<link rel="stylesheet" href="./css/main.css">
</head>
<body>

    <div id="toast" class="toast-hidden">🔔 <span id="toast-msg">Action confirmée</span></div>

    <div id="app">
        <main id="view-recipes" class="view active">
            <header class="top-bar">
                <h1>Que manger ?</h1>
                <button id="btn-filters" class="icon-btn">⚙️</button>
            </header>
            <section id="card-stack">
                <p style="text-align:center; color: var(--text-light); margin-top: 50px;">Chargement des recettes...</p>
            </section>
        </main>

        <main id="view-fridge" class="view">
            <header class="top-bar">
                <h1>Mon Frigo</h1>
            </header>
            
            <section class="content-area">
                <div class="search-container" style="display: flex; gap: 8px;">
                    <input type="text" id="ingredient-search" placeholder="🔍 Ingrédient..." style="flex: 2;">
                    <input type="text" id="ingredient-qty" placeholder="Qté (ex: 2, 500g)" style="flex: 1; max-width: 110px; text-align: center;">
                </div>

                <div class="fridge-section">
                    <h3>Mon Stock Actuel</h3>
                    <div class="tag-cloud" id="my-stock-tags">
                        <p class="empty-state">Ton frigo est vide. Ajoute des ingrédients !</p>
                    </div>
                </div>

                <div class="fridge-section" style="margin-top: 30px;">
                    <h3>Ajout Rapide</h3>
                    <div class="tag-cloud" id="essential-tags">
                        </div>
                </div>
            </section>
        </main>

        <main id="view-shopping" class="view">
            <header class="top-bar">
                <h1>Liste de courses</h1>
                <button id="btn-clear-purchased" class="icon-btn" title="Vider le caddie">🧹</button>
            </header>
            
            <section class="content-area">
                <div class="search-container" style="display: flex; gap: 8px;">
                    <input type="text" id="shopping-input" placeholder="🛒 Ajouter (Entrée)..." style="flex: 2;">
                    <input type="text" id="shopping-qty" placeholder="Qté" style="flex: 1; max-width: 80px; text-align: center;">
                </div>

                <div class="shopping-list-container">
                    <ul id="shopping-list-active" class="shopping-list">
                        </ul>

                    <h3 class="completed-title" id="completed-title" style="display: none;">Déjà dans le caddie</h3>
                    <ul id="shopping-list-completed" class="shopping-list completed">
                        </ul>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" data-target="view-recipes">
                <span class="icon">🍽️</span>
                <span class="label">Recettes</span>
            </button>
            <button class="nav-item" data-target="view-fridge">
                <span class="icon">❄️</span>
                <span class="label">Frigo</span>
            </button>
            <button class="nav-item" data-target="view-shopping">
                <span class="icon">🛒</span>
                <span class="label">Courses</span>
            </button>
        </nav>
    </div>

    <script src="js/app.js" type="module"></script>
    <script src="js/navigation.js" type="module"></script>

    <div id="recipe-modal" class="modal-hidden">
        <button id="close-modal" class="icon-btn">✕</button>
        <div id="modal-content">
            </div>
    </div>

</body>
</html>
